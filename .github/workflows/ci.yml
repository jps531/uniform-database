# Checks every pull request (Dependabot's included) and every push to main.
#
# Two jobs. `checks`: lint, formatting, docstrings, the unit tests and the
# per-script coverage gate, and that every YAML file parses. `golden`: the
# golden suite on golden/fixture/, the tracked copy of exactly the artwork
# the suite uses (docs/golden_suite.md, section 3).
#
# The full artwork tree isn't in git, so CI can't run the pipeline itself or
# a full golden run: those run on the Mac that holds the iCloud folder, and
# CI can't tell a stale fixture from a current one (CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: nothing here writes to the repo.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always
# finish, so every merge gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to commits (tags can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true  # keyed on uv.lock, so a cached install is the locked one
      - name: Install (exactly as locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Formatting
        run: uv run --frozen ruff format --check .
      - name: Docstrings (every module and function, tests included)
        run: uv run --frozen docstr-coverage scripts tests --skip-magic --skip-init --fail-under 100
      - name: Unit tests
        run: uv run --frozen pytest -n auto --cov
      - name: Coverage (95% or more for every script)
        run: uv run --frozen python tests/coverage_gate.py
      - name: Config parses
        run: |
          uv run --frozen python - <<'PY'
          import pathlib, yaml
          files = sorted(pathlib.Path("configs").glob("*.yaml")) + sorted(pathlib.Path("golden").glob("*.yaml"))
          for f in files:
              yaml.safe_load(f.read_text())
          print(f"{len(files)} YAML files parse")
          PY

  # The golden suite on golden/fixture/, the copy of the artwork it needs
  # (scripts/golden/golden_fixture.py builds it on the Mac). Fails on any defect or
  # note, on any helmet that doesn't re-pad from its Marks source identically,
  # and on any venue that doesn't re-crop identically.
  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install (exactly as locked)
        run: uv sync --frozen
      - name: Golden suite (compositions, helmets, venues)
        run: uv run --frozen scripts/golden/golden_ci.py
      - name: Upload contact sheets and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-run
          path: golden/run-ci/
          if-no-files-found: ignore
          retention-days: 14
