# View templates — how standardized elements are placed into a composed view.
#
# ANCHOR: every placement is top-CENTRE. `x` is the horizontal CENTRE of the
# element, `y` is its top edge. The composer converts to a top-left paste
# point as x - (scaled_width / 2).
#
# SCALE applies to the whole standardized canvas, not just the artwork.
# Because artwork sits top-centre on its padded canvas (horizontally centred,
# top edge on the canvas top), scaling the canvas keeps the artwork in the
# same place relative to the placement point, and proportional.
#
# REQUIREMENT — three distinct behaviours, deliberately not two:
#   required     the placement must resolve, or composition fails loudly.
#   explicit     only placed when the caller asks for it. Helmet left is
#                drawn for every element but is only shown when the two
#                sides differ meaningfully, which is a judgement the data
#                records, not something the composer can infer.
#   if_available placed when a file exists, silently skipped otherwise.
#                Jersey left (the sleeve detail) only exists from 1989.
#
# The difference matters: `explicit` absent means "deliberately not shown",
# `if_available` absent means "no artwork exists". Collapsing them would
# either hide a real gap or force a flag onto every pre-1989 combination.

templates:

  - creator: hailstateunis
    sport: football
    view_kind: full
    output: { width: 3764, height: 4121 }
    background: transparent
    placements:

      # --- helmet row -----------------------------------------------------
      - { slot: helmet, viewpoint: front, x: 960,  y: 79,   scale: 1.00, z: 10, requirement: required }
      - { slot: helmet, viewpoint: right, x: 1882, y: 79,   scale: 1.00, z: 10, requirement: required }
      - { slot: helmet, viewpoint: back,  x: 2804, y: 79,   scale: 1.00, z: 10, requirement: required }
      - { slot: helmet, viewpoint: left,  x: 1882, y: 936,  scale: 0.36, z: 40, requirement: explicit }

      # --- jersey row -----------------------------------------------------
      - { slot: jersey, viewpoint: front, x: 960,  y: 936,  scale: 1.00, z: 20, requirement: required }
      - { slot: jersey, viewpoint: back,  x: 2804, y: 936,  scale: 1.00, z: 20, requirement: required }
      - { slot: jersey, viewpoint: left,  x: 1882, y: 1690, scale: 0.82, z: 20, requirement: if_available }

      # --- pants, foreground ----------------------------------------------
      - { slot: pants,  viewpoint: front, x: 1293, y: 2325, scale: 1.00, z: 30, requirement: required }
      - { slot: pants,  viewpoint: left,  x: 3085, y: 2325, scale: 1.00, z: 30, requirement: required }

  # A reduced view: one helmet, jersey front, pants side. The left-helmet
  # inset is again `explicit` — shown only when the two sides differ.
  - creator: hailstateunis
    sport: football
    view_kind: condensed
    output: { width: 2343, height: 3404 }
    background: transparent
    placements:
      - { slot: helmet, viewpoint: right, x: 942,  y: 78,     scale: 1.00, z: 10, requirement: required }
      - { slot: jersey, viewpoint: front, x: 942,  y: 936,    scale: 1.00, z: 20, requirement: required }
      - { slot: pants,  viewpoint: left,  x: 1859, y: 1717,   scale: 1.00, z: 30, rotation: 20,  requirement: required }
      - { slot: helmet, viewpoint: left,  x: 1763, y: 278,  scale: 0.50, z: 40, requirement: explicit }

  # --- Cropped subsets of `full` ----------------------------------------
  # Coordinates are DERIVED from the full template by subtracting the crop
  # origin, so these layouts match it exactly. If `full` moves — or if an
  # ELEMENT CANVAS is resized — recompute these rather than nudging them
  # independently. They were recomputed once already, when football_jersey
  # was tightened from 2000x2300 to 1792x2044 and football_helmet_face from
  # 750x900 to 678x808.

  # Helmet row only, three views. Crop origin (621, 79) in full.
  - creator: hailstateunis
    sport: football
    view_kind: helmets-3
    output: { width: 2522, height: 854 }
    background: transparent
    placements:
      - { slot: helmet, viewpoint: front, x: 339,  y: 0, scale: 1.00, z: 10, requirement: required }
      - { slot: helmet, viewpoint: right, x: 1261, y: 0, scale: 1.00, z: 10, requirement: required }
      - { slot: helmet, viewpoint: back,  x: 2183, y: 0, scale: 1.00, z: 10, requirement: required }

  # As helmets-3 plus the left inset. REQUIRED here, not `explicit`: the only
  # reason to choose this view over helmets-3 is to show the left side.
  - creator: hailstateunis
    sport: football
    view_kind: helmets-4
    output: { width: 2522, height: 1164 }
    background: transparent
    placements:
      - { slot: helmet, viewpoint: front, x: 339,  y: 0,   scale: 1.00, z: 10, requirement: required }
      - { slot: helmet, viewpoint: right, x: 1261, y: 0,   scale: 1.00, z: 10, requirement: required }
      - { slot: helmet, viewpoint: back,  x: 2183, y: 0,   scale: 1.00, z: 10, requirement: required }
      - { slot: helmet, viewpoint: left,  x: 1261, y: 857, scale: 0.36, z: 40, requirement: required }

  # Jersey row only. Crop origin (64, 936) — POSITIVE now that the jersey
  # canvas is tight. It was -40 when that canvas was 2000px wide and
  # overhung the left edge of `full` by 40px of padding.
  - creator: hailstateunis
    sport: football
    view_kind: jersey-full
    output: { width: 3636, height: 2044 }
    background: transparent
    placements:
      - { slot: jersey, viewpoint: front, x: 896,  y: 0,   scale: 1.00, z: 20, requirement: required }
      - { slot: jersey, viewpoint: back,  x: 2740, y: 0,   scale: 1.00, z: 20, requirement: required }
      - { slot: jersey, viewpoint: left,  x: 1818, y: 754, scale: 0.82, z: 20, requirement: if_available }

  # Pants only. Crop origin (678, 2325).
  - creator: hailstateunis
    sport: football
    view_kind: pants-full
    output: { width: 2776, height: 1724 }
    background: transparent
    placements:
      - { slot: pants, viewpoint: front, x: 615,  y: 0, scale: 1.00, z: 30, requirement: required }
      - { slot: pants, viewpoint: left,  x: 2407, y: 0, scale: 1.00, z: 30, requirement: required }

  # --- Icon strips -------------------------------------------------------
