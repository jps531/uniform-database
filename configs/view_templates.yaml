  # ======================================================================
  # MEN'S AND WOMEN'S BASKETBALL, SOCCER, VOLLEYBALL
  # ======================================================================
  # COMBO views show TWO uniforms; placements with `uniform: 2` take their
  # element from --jersey2 / --shorts2 / --number2. The second uniform is a
  # deliberately SMALLER inset, not an equal partner — soccer at 0.77 or
  # 0.69, volleyball at 0.55 or 0.70. In soccer it is always the KEEPER,
  # which is why soccer has no long-sleeve uniform-1 combos: only keepers
  # wear long sleeves.
  #
  # Canvas sizes include 1px of safety beyond the widest element measured by
  # the golden suite (2px where the placement is rotated, since a rotated
  # corner depends on each element's shape). Grown only on the RIGHT and
  # BOTTOM, so no placement moved.
  #
  # z-order:
  #   - shorts UNDER the jersey, except in CONDENSED views, where they go over
  #   - shorts front always OVER shorts back
  #   - the uniform-2 inset above all of uniform 1
  # Men's basketball shorts are left/right, so the front/back rule never
  # applies to them.

