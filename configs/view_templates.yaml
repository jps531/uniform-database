    background: transparent
    placements:
      - { slot: hat,    viewpoint: front, x: 889,  y: 0,    scale: 0.19, z: 10, requirement: required }
      - { slot: jersey, viewpoint: front, x: 889,  y: 494,  scale: 1.00, z: 30, requirement: required }
      - { slot: jersey, viewpoint: back,  x: 2444, y: 124,  scale: 1.00, z: 20, requirement: required }
      - { slot: pants,  viewpoint: left,  x: 3375, y: 1035, scale: 0.72, z: 10, requirement: required }

  # z-order matters here: jersey front OVER jersey back OVER pants left.
