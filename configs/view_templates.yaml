    background: transparent
    placements:
      - { slot: helmet, viewpoint: icon, x: 375, y: 0,    scale: 1.00, z: 10, requirement: required }
      - { slot: jersey, viewpoint: icon, x: 375, y: 840,  scale: 1.00, z: 10, requirement: required }
      - { slot: pants,  viewpoint: icon, x: 375, y: 1680, scale: 1.00, z: 10, requirement: required }

  # ======================================================================
  # BASEBALL / SOFTBALL
  # ======================================================================
  # Canvases are sized to the ARTWORK, not the padded element canvas, so a
  # few px of transparent padding hangs past the edge on some placements.
  # Harmless — compose.py clips it.
  #
  # `-tq` variants are for the three-quarter sleeve era, whose jersey canvas
  # (diamond_jersey_tq) is 2114 wide against the standard 1780 (this note
  # gave 2140 and 1800 when they were measured). They were MEASURED rather than
  # derived: jerseys are not always centred in these layouts, so the
  # arithmetic shortcut that worked for the cropped football views does not
  # hold here.
  #
  # The hat composes at 19%. Its scale is deliberately NOT baked into the
  # asset: baking would shrink the outline too, so the rendered stroke would
  # be unchanged and resolution would be lost for nothing. Matching stroke
  # weight is an ARTWORK change — see baseball_hat in canvas_definitions.

  # --- Jersey only, front and back ---------------------------------------
  - creator: hailstateunis
    sport: baseball
    view_kind: diamond-jersey
    output: { width: 3600, height: 1960 }
    background: transparent
    placements:
      - { slot: jersey, viewpoint: front, x: 900,  y: 0, scale: 1.00, z: 20, requirement: required }
      - { slot: jersey, viewpoint: back,  x: 2700, y: 0, scale: 1.00, z: 20, requirement: required }

  - creator: hailstateunis
    sport: baseball
    view_kind: diamond-jersey-tq
    output: { width: 4280, height: 1960 }
    background: transparent
    placements:
      - { slot: jersey, viewpoint: front, x: 1069, y: 0, scale: 1.00, z: 20, requirement: required }
      - { slot: jersey, viewpoint: back,  x: 3210, y: 0, scale: 1.00, z: 20, requirement: required }

  # --- Pants only, left and right. Softball only — baseball has no right.
  - creator: hailstateunis
    sport: softball
    view_kind: diamond-pants
    output: { width: 3600, height: 1397 }
    background: transparent
    placements:
      - { slot: pants, viewpoint: right, x: 900,  y: 0, scale: 0.72, z: 30, requirement: required }
      - { slot: pants, viewpoint: left,  x: 2700, y: 0, scale: 0.72, z: 30, requirement: required }

  # --- Baseball full ------------------------------------------------------
  - creator: hailstateunis
    sport: baseball
    view_kind: baseball-full
