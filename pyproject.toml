[project]
name = "uniform-database"
version = "0.1.0"
description = "Uniform archive for Mississippi State athletics: the asset pipeline (scripts/) and its config."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "pyyaml>=6.0",
    "numpy>=1.24",  # only compose.py --diff
]

[dependency-groups]
dev = [
    "docstr-coverage>=2.3",
    "ruff>=0.9",
]

# scripts/ is a folder of command-line tools, not an installable package.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by the formatter)
]
