[project]
name = "uniform-database"
version = "0.1.0"
description = "Uniform archive for Mississippi State athletics: the asset pipeline (scripts/) and its config."
requires-python = ">=3.13"
dependencies = [
    "pillow>=10",
    "pyyaml>=6.0",
    "numpy>=1.24",  # only compose.py --diff
]

[dependency-groups]
dev = [
    "docstr-coverage>=2.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
]

# scripts/ is a folder of command-line tools, not an installable package.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/pipeline", "scripts/migration", "scripts/golden", "tests"]
addopts = "--cov --cov-report=term-missing --cov-report=json"

[tool.coverage.run]
branch = true
source = ["scripts"]
# golden_ci.py and golden_run.py run other scripts as subprocesses; measure those too.
patch = ["subprocess"]

[tool.coverage.json]
output = "coverage.json"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by the formatter)
]
